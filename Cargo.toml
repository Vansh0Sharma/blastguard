[package]
name = "blastguard"
version = "0.1.0"
edition = "2021"
description = "A local command-policy and ephemeral Git worktree safety tool for AI coding agents"
license = "Apache-2.0"
readme = "README.md"
keywords = ["security", "cli", "git", "shell", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[profile.release]
lto = "thin"
strip = true
